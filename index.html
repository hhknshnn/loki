<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Loki Nerf Defense</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b130f;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    .hud {
      position: fixed;
      inset: max(12px, env(safe-area-inset-top)) 12px auto 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      gap: 10px;
      z-index: 5;
    }
    .card {
      background: rgba(35, 23, 16, .72);
      border: 2px solid rgba(255, 210, 110, .35);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.24);
      backdrop-filter: blur(8px);
      text-shadow: 0 2px 6px rgba(0,0,0,.45);
      min-width: 92px;
    }
    .label { font-size: 12px; color: #ffbd36; font-weight: 900; letter-spacing: .5px; }
    .value { font-size: 26px; font-weight: 900; line-height: 1.05; }
    .hearts { font-size: 26px; letter-spacing: 2px; }
    .center {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 10;
      text-align: center;
      padding: 22px;
      pointer-events: none;
    }
    .panel {
      pointer-events: auto;
      width: min(420px, 92vw);
      background: rgba(39, 24, 16, .84);
      border: 2px solid rgba(255, 210, 110, .42);
      border-radius: 26px;
      padding: 24px;
      box-shadow: 0 22px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 10px; font-size: clamp(34px, 9vw, 54px); line-height: .95; color: #ffbd36; text-shadow: 0 4px 0 #6a351a; }
    p { margin: 10px 0; opacity: .92; line-height: 1.45; }
    button {
      touch-action: manipulation;
      margin-top: 12px;
      border: 0;
      border-radius: 18px;
      padding: 14px 22px;
      background: linear-gradient(180deg, #ffcc47, #ff7a00);
      color: #331900;
      font-weight: 900;
      font-size: 18px;
      box-shadow: 0 8px 0 #8e4200, 0 14px 24px rgba(0,0,0,.35);
      cursor: pointer;
    }
    button:active { transform: translateY(4px); box-shadow: 0 4px 0 #8e4200, 0 8px 20px rgba(0,0,0,.3); }
    .controls {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 6;
      pointer-events: none;
    }
    .touchBtn {
      touch-action: none;
      pointer-events: auto;
      width: 76px;
      height: 76px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(35,23,16,.55);
      border: 2px solid rgba(255,255,255,.22);
      font-size: 28px;
      font-weight: 900;
      user-select: none;
      backdrop-filter: blur(8px);
    }
    .shootBtn { width: 94px; height: 94px; background: rgba(255, 122, 0, .72); }
    @media (min-width: 820px) {
      .controls { display: none; }
      .card { min-width: 120px; }
      .label { font-size: 14px; }
      .value { font-size: 34px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="card"><div class="label">SKOR</div><div class="value" id="score">0</div></div>
    <div class="card"><div class="label">DALGA</div><div class="value" id="wave">1</div></div>
    <div class="card"><div class="label">CAN</div><div class="hearts" id="hearts">❤️❤️❤️</div></div>
  </div>

  <div class="controls">
    <div style="display:flex;gap:12px">
      <div class="touchBtn" id="leftBtn">‹</div>
      <div class="touchBtn" id="rightBtn">›</div>
    </div>
    <div class="touchBtn shootBtn" id="shootBtn">🎯</div>
  </div>

  <div class="center" id="menu">
    <div class="panel">
      <h1>LOKI NERF</h1>
      <p>Loki ile fareleri Nerf dartlarıyla durdur. Kaçan her fare 1 can götürür.</p>
      <p><b>Mobil:</b> sol/sağ buton + ateş. <br><b>PC:</b> A-D / ←-→ ve Space.</p>
      <button id="startBtn">OYNA</button>
    </div>
  </div>

<script>
// Mobil tarayıcıda çift dokunma/pinch zoom engeli
let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) event.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

document.addEventListener('gesturestart', function (event) {
  event.preventDefault();
});

// Loki görseli aynı klasörde loki.png olmalı.
const LOKI_SRC = "loki.png";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const waveEl = document.getElementById("wave");
const heartsEl = document.getElementById("hearts");
const menu = document.getElementById("menu");
const startBtn = document.getElementById("startBtn");
const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const shootBtn = document.getElementById("shootBtn");

let vw = innerWidth, vh = innerHeight, dpr = 1;
let running = false, score = 0, lives = 3, wave = 1;
let mice = [], darts = [], puffs = [], floating = [];
let keys = {}, touchLeft = false, touchRight = false;
let spawnTimer = 0, lastTime = 0, audioReady = false;
let best = Number(localStorage.getItem("lokiNerfBest") || 0);

const lokiImg = new Image();
lokiImg.src = LOKI_SRC;

const cat = { x: vw / 2, y: vh - 115, w: 170, h: 135, speed: 560, cooldown: 0 };

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  vw = innerWidth; vh = innerHeight;
  canvas.width = Math.floor(vw * dpr);
  canvas.height = Math.floor(vh * dpr);
  canvas.style.width = vw + "px";
  canvas.style.height = vh + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cat.y = vh - (vh < 680 ? 94 : 122);
  cat.w = Math.min(190, Math.max(135, vw * .26));
  cat.h = cat.w * .79;
}
addEventListener("resize", resize);
resize();

let audioCtx;
function initAudio() {
  if (audioReady) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioReady = true;
}
function tone(freq, dur, type="sine", gain=.08) {
  if (!audioReady) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur);
}
const sfx = {
  shoot() { tone(720,.055,"square",.055); tone(280,.08,"triangle",.035); },
  hit() { tone(980,.06,"sine",.07); setTimeout(()=>tone(1320,.05,"sine",.05),35); },
  hurt() { tone(120,.18,"sawtooth",.08); },
  start() { tone(520,.08,"triangle",.05); setTimeout(()=>tone(780,.08,"triangle",.05),80); }
};

function reset() {
  initAudio(); sfx.start();
  running = true; score = 0; lives = 3; wave = 1;
  mice = []; darts = []; puffs = []; floating = [];
  spawnTimer = 20; cat.x = vw / 2; cat.cooldown = 0;
  updateHud();
  menu.style.display = "none";
}

function updateHud() {
  scoreEl.textContent = Math.floor(score);
  waveEl.textContent = wave;
  heartsEl.textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
}

function drawBackground(t) {
  const g = ctx.createLinearGradient(0,0,0,vh);
  g.addColorStop(0,"#8fd0ff");
  g.addColorStop(.55,"#ffe2b4");
  g.addColorStop(.56,"#8b5a32");
  g.addColorStop(1,"#5e351d");
  ctx.fillStyle = g; ctx.fillRect(0,0,vw,vh);

  ctx.fillStyle = "#ead2ad";
  ctx.fillRect(0,0,vw*.19,vh*.58);
  ctx.fillRect(vw*.81,0,vw*.19,vh*.58);

  ctx.fillStyle = "#77c7ff";
  roundRect(vw*.24, 70, vw*.52, vh*.43, 16); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.75)";
  for(let i=0;i<5;i++) {
    const x = vw*.29 + i*vw*.1 + Math.sin(t*.0004+i)*8;
    const y = 130 + Math.sin(t*.0005+i)*12;
    blob(x,y,22);
  }

  ctx.fillStyle = "rgba(255,255,255,.22)";
  for(let x=0;x<vw;x+=90) ctx.fillRect(x, vh*.58, 3, vh*.42);

  ctx.fillStyle = "rgba(255,238,210,.28)";
  ctx.beginPath(); ctx.ellipse(vw*.5, vh-40, Math.min(320,vw*.38), 48, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = "#b98755";
  ctx.fillRect(38, vh*.45, 25, vh*.35);
  ctx.beginPath(); ctx.ellipse(65, vh*.45, 70, 18, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(86, vh*.32, 55, 16, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = "#c79225";
  roundRect(vw-155, vh-150, 112, 72, 10); ctx.fill();
  ctx.fillStyle = "rgba(70,35,12,.55)";
  ctx.font = "900 13px Arial"; ctx.textAlign = "center";
  ctx.fillText("LOKI'S", vw-99, vh-119); ctx.fillText("TOYS", vw-99, vh-102);
}

function blob(x,y,r) {
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2); ctx.arc(x+r*.75,y+5,r*.75,0,Math.PI*2); ctx.arc(x-r*.75,y+7,r*.65,0,Math.PI*2);
  ctx.fill();
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawLoki() {
  ctx.save();
  ctx.translate(cat.x, cat.y);

  if (lokiImg.complete) ctx.drawImage(lokiImg, -cat.w/2, -cat.h/2, cat.w, cat.h);
  else {
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.ellipse(0,0,cat.w/2,cat.h/2,0,0,Math.PI*2); ctx.fill();
  }

  ctx.translate(cat.w*.20, -cat.h*.04);
  ctx.rotate(-0.22);
  ctx.fillStyle = "#f5f0e8";
  ctx.beginPath(); ctx.ellipse(-12,22,18,12,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = "#1458d8"; roundRect(-12,-12,68,30,8); ctx.fill();
  ctx.fillStyle = "#ff7a00"; roundRect(40,-8,36,16,6); ctx.fill();
  ctx.fillStyle = "#fff"; roundRect(-6,-7,30,14,5); ctx.fill();
  ctx.fillStyle = "#ff7a00"; roundRect(10,14,14,34,5); ctx.fill();
  ctx.fillStyle = "#ffd23f"; roundRect(22,14,14,23,5); ctx.fill();
  ctx.restore();
}

function drawMouse(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(Math.sin(m.wiggle)*.12);
  ctx.scale(m.flip,1);
  ctx.fillStyle = m.boss ? "#585858" : "#707070";
  ctx.beginPath(); ctx.ellipse(0, 5, m.r*1.1, m.r*.78, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-m.r*.44,-m.r*.45,m.r*.3,0,Math.PI*2); ctx.arc(m.r*.44,-m.r*.45,m.r*.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "#ffb6c7";
  ctx.beginPath(); ctx.arc(-m.r*.44,-m.r*.45,m.r*.18,0,Math.PI*2); ctx.arc(m.r*.44,-m.r*.45,m.r*.18,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "#111";
  ctx.beginPath(); ctx.arc(-m.r*.24,0,2.5,0,Math.PI*2); ctx.arc(m.r*.24,0,2.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "#f28fa7"; ctx.beginPath(); ctx.arc(0,8,4,0,Math.PI*2); ctx.fill();
  if (m.boss) {
    ctx.fillStyle = "#61a84f";
    ctx.beginPath(); ctx.arc(0,-m.r*.7,m.r*.55,Math.PI,0); ctx.fill();
    ctx.fillRect(-m.r*.55,-m.r*.72,m.r*1.1,5);
  }
  ctx.strokeStyle = "#555"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(m.r,7); ctx.quadraticCurveTo(m.r+22,18,m.r+36,1); ctx.stroke();
  ctx.restore();
}

function drawDart(d) {
  ctx.save();
  ctx.translate(d.x,d.y);
  ctx.rotate(d.rot);
  ctx.fillStyle="#154dd0"; roundRect(-5,-20,10,34,4); ctx.fill();
  ctx.fillStyle="#ff7a00"; ctx.beginPath(); ctx.arc(0,-20,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="rgba(255,238,160,.36)"; ctx.beginPath(); ctx.ellipse(0,18,5,15,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawEffects(dt) {
  for (let i=puffs.length-1;i>=0;i--) {
    const p=puffs[i]; p.life-=dt; p.r+=dt*.08; p.a=Math.max(0,p.life/300);
    ctx.fillStyle=`rgba(255,189,54,${p.a})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    if(p.life<=0) puffs.splice(i,1);
  }
  for (let i=floating.length-1;i>=0;i--) {
    const f=floating[i]; f.life-=dt; f.y-=dt*.05;
    ctx.save(); ctx.globalAlpha=Math.max(0,f.life/700);
    ctx.font="900 30px Arial"; ctx.textAlign="center"; ctx.lineWidth=5;
    ctx.strokeStyle="#491500"; ctx.fillStyle="#ffd23f";
    ctx.strokeText(f.text,f.x,f.y); ctx.fillText(f.text,f.x,f.y);
    ctx.restore();
    if(f.life<=0) floating.splice(i,1);
  }
}

function shoot() {
  if (!running || cat.cooldown > 0) return;

  // En yakındaki fareye doğru hafif nişan alır; böylece ekranın en solundaki fareler de vurulabilir.
  let target = null;
  let bestDist = Infinity;
  for (const m of mice) {
    const dx = Math.abs(m.x - cat.x);
    if (m.y < cat.y && dx < bestDist) {
      bestDist = dx;
      target = m;
    }
  }

  const muzzleSide = target && target.x < cat.x ? -0.26 : 0.32;
  const startX = cat.x + cat.w * muzzleSide;
  const startY = cat.y - cat.h * .25;

  let vx = 0;
  let vy = -780;
  let rot = muzzleSide < 0 ? .18 : -.18;

  if (target) {
    const dx = target.x - startX;
    const dy = target.y - startY;
    const len = Math.max(1, Math.sqrt(dx*dx + dy*dy));
    const speed = 800;
    vx = dx / len * speed;
    vy = dy / len * speed;
    rot = Math.atan2(vy, vx) + Math.PI / 2;
  }

  darts.push({ x: startX, y: startY, vx, vy, rot, w: 14, h: 38 });
  cat.cooldown = 180;
  sfx.shoot();
}

function spawnMouse() {
  const boss = wave % 5 === 0 && Math.random() < .16;
  const r = boss ? 29 : 18 + Math.random()*8;
  mice.push({
    x: 40 + Math.random()*(vw-80),
    y: -45,
    r, hp: boss ? 3 : 1,
    vy: (80 + Math.random()*70 + wave*9) * (vh < 700 ? .92 : 1),
    wiggle: Math.random()*9,
    flip: Math.random()>.5 ? 1 : -1,
    boss
  });
}

function collide(a,b) {
  const dx=a.x-b.x, dy=a.y-b.y;
  return dx*dx+dy*dy < (a.r+12)*(a.r+12);
}

function update(dt, t) {
  if (!running) return;
  const dir = (keys.ArrowRight||keys.d||touchRight ? 1 : 0) - (keys.ArrowLeft||keys.a||touchLeft ? 1 : 0);
  cat.x += dir * cat.speed * dt/1000;
  cat.x = Math.max(cat.w*.45, Math.min(vw-cat.w*.45, cat.x));
  cat.cooldown = Math.max(0, cat.cooldown-dt);

  score += dt*.006;
  wave = 1 + Math.floor(score / 120);
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnMouse();
    spawnTimer = Math.max(330, 1100 - wave*55 - Math.random()*260);
  }

  for (let i=darts.length-1;i>=0;i--) {
    const d=darts[i];
    d.x += (d.vx || 0) * dt/1000;
    d.y += d.vy * dt/1000;
    if (d.y < -50 || d.x < -60 || d.x > vw + 60) darts.splice(i,1);
  }

  for (let i=mice.length-1;i>=0;i--) {
    const m=mice[i];
    m.wiggle += dt*.006;
    m.y += m.vy*dt/1000;
    m.x += Math.sin(m.wiggle)*dt*.018;

    for (let j=darts.length-1;j>=0;j--) {
      if (collide(m,darts[j])) {
        darts.splice(j,1);
        m.hp--;
        puffs.push({x:m.x,y:m.y,r:8,life:300});
        if (m.hp <= 0) {
          const gain = m.boss ? 50 : 15;
          score += gain;
          floating.push({x:m.x,y:m.y,text:"VUR! +" + gain, life:700});
          mice.splice(i,1);
          sfx.hit();
        } else sfx.hit();
        break;
      }
    }

    if (mice[i] && m.y > vh + 40) {
      mice.splice(i,1);
      lives--; sfx.hurt();
      if (lives <= 0) gameOver();
    }
  }
  updateHud();
}

function draw(t, dt) {
  drawBackground(t);
  for (const d of darts) drawDart(d);
  for (const m of mice) drawMouse(m);
  drawLoki();
  drawEffects(dt);
}

function loop(t) {
  const dt = Math.min(33, t - lastTime || 16);
  lastTime = t;
  update(dt, t);
  draw(t, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function gameOver() {
  running = false;
  best = Math.max(best, Math.floor(score));
  localStorage.setItem("lokiNerfBest", best);
  menu.style.display = "grid";
  menu.querySelector(".panel").innerHTML = `
    <h1>OYUN BİTTİ</h1>
    <p>Skor: <b>${Math.floor(score)}</b><br>En iyi skor: <b>${best}</b></p>
    <p>Fareler Loki'nin oyuncak kutusuna ulaştı!</p>
    <button id="againBtn">TEKRAR OYNA</button>
  `;
  document.getElementById("againBtn").onclick = reset;
}

startBtn.onclick = reset;
addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.code === "Space") { e.preventDefault(); initAudio(); shoot(); }
});
addEventListener("keyup", e => keys[e.key] = false);

function bindHold(el, down, up) {
  el.addEventListener("pointerdown", e => { e.preventDefault(); initAudio(); down(); el.setPointerCapture?.(e.pointerId); });
  el.addEventListener("pointerup", e => { e.preventDefault(); up(); });
  el.addEventListener("pointercancel", up);
  el.addEventListener("pointerleave", up);
}
bindHold(leftBtn, ()=>touchLeft=true, ()=>touchLeft=false);
bindHold(rightBtn, ()=>touchRight=true, ()=>touchRight=false);
shootBtn.addEventListener("pointerdown", e => { e.preventDefault(); initAudio(); if(!running) reset(); else shoot(); });

canvas.addEventListener("pointerdown", e => {
  initAudio();
  if (!running) reset();
});
</script>
</body>
</html>
